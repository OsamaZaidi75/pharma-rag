name: docker

# Build the image on GitHub Actions and push it to GHCR, so the Oracle VM
# (2 CPUs, 20+ min builds) just pulls instead of building. The VM is ARM64,
# so the image MUST be linux/arm64 — built here with QEMU + buildx.
#
#   ghcr.io/osamazaidi75/pharma-rag:latest
#   ghcr.io/osamazaidi75/pharma-rag:<git sha>
#
# No user secrets: authentication uses the built-in GITHUB_TOKEN with
# packages:write. The visibility step is best-effort (continue-on-error):
# a first push may create a private package, and making it public needs
# an extra permission the token may not have — if it fails, flip it to
# public in the repo's Packages settings (or test an anonymous pull).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/osamazaidi75/pharma-rag:latest
            ghcr.io/osamazaidi75/pharma-rag:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Make the GHCR package public (best effort)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PATCH /user/packages/container/pharma-rag \
            -f visibility=public
